<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="crcT crcD" font-family="Inter, -apple-system, Segoe UI, sans-serif">
  <title id="crcT">Six checks before hiring a water damage restoration company</title>
  <desc id="crcD">Checklist of six things to confirm: a live person answers 24/7, IICRC certified technicians, a California CSLB license for any rebuild work, general liability and workers compensation insurance, moisture readings and photos you get copies of, and a written scope before work starts.</desc>
  <rect width="760" height="380" rx="16" fill="#ffffff"/><rect width="760" height="380" rx="16" fill="none" stroke="#e4ebee"/>
  <text x="30" y="42" font-size="15" font-weight="700" fill="#0e2433">Six checks, about five minutes on the phone</text>
  <text x="30" y="63" font-size="12" fill="#54707c">Every one of these is something a legitimate company can answer immediately.</text>

  <g font-size="13" fill="#0e2433">
    <g transform="translate(30 88)">
      <rect width="340" height="78" rx="12" fill="#f7fafb" stroke="#e4ebee"/>
      <circle cx="32" cy="39" r="14" fill="#0a7486"/><path d="M25 39 l5 5 l9 -10" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="34" font-weight="700">A person answers, 24/7</text>
      <text x="60" y="54" font-size="11.5" fill="#54707c">Not a voicemail or a callback form</text>
    </g>
    <g transform="translate(390 88)">
      <rect width="340" height="78" rx="12" fill="#f7fafb" stroke="#e4ebee"/>
      <circle cx="32" cy="39" r="14" fill="#0a7486"/><path d="M25 39 l5 5 l9 -10" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="34" font-weight="700">IICRC-certified techs</text>
      <text x="60" y="54" font-size="11.5" fill="#54707c">WRT and ASD are the water credentials</text>
    </g>
    <g transform="translate(30 180)">
      <rect width="340" height="78" rx="12" fill="#f7fafb" stroke="#e4ebee"/>
      <circle cx="32" cy="39" r="14" fill="#0a7486"/><path d="M25 39 l5 5 l9 -10" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="34" font-weight="700">CSLB license for rebuild</text>
      <text x="60" y="54" font-size="11.5" fill="#54707c">Look it up at cslb.ca.gov in seconds</text>
    </g>
    <g transform="translate(390 180)">
      <rect width="340" height="78" rx="12" fill="#f7fafb" stroke="#e4ebee"/>
      <circle cx="32" cy="39" r="14" fill="#0a7486"/><path d="M25 39 l5 5 l9 -10" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="34" font-weight="700">Liability + workers' comp</text>
      <text x="60" y="54" font-size="11.5" fill="#54707c">Ask for the certificate, not a promise</text>
    </g>
    <g transform="translate(30 272)">
      <rect width="340" height="78" rx="12" fill="#f7fafb" stroke="#e4ebee"/>
      <circle cx="32" cy="39" r="14" fill="#0a7486"/><path d="M25 39 l5 5 l9 -10" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="34" font-weight="700">You get the readings</text>
      <text x="60" y="54" font-size="11.5" fill="#54707c">Moisture logs and photos, every visit</text>
    </g>
    <g transform="translate(390 272)">
      <rect width="340" height="78" rx="12" fill="#f7fafb" stroke="#e4ebee"/>
      <circle cx="32" cy="39" r="14" fill="#0a7486"/><path d="M25 39 l5 5 l9 -10" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="34" font-weight="700">Written scope first</text>
      <text x="60" y="54" font-size="11.5" fill="#54707c">What they will remove, and why</text>
    </g>
  </g>
</svg>
