<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="seTitle seDesc" font-family="Inter, -apple-system, Segoe UI, sans-serif">
  <title id="seTitle">Five ways storm water gets into Central Valley homes</title>
  <desc id="seDesc">House cross-section showing numbered entry points: 1 roof flashing failures, 2 clogged gutters and short downspouts, 3 grading sloped toward the house, 4 crawl space vents near grade, 5 street ponding at the driveway.</desc>
  <rect width="760" height="420" rx="16" fill="#ffffff"/>
  <rect width="760" height="420" rx="16" fill="none" stroke="#e4ebee"/>
  <text x="36" y="46" font-size="19" font-weight="700" fill="#0e2433" letter-spacing="-0.3">Where storm water gets in</text>
  <!-- rain -->
  <g stroke="#9fd6de" stroke-width="2" stroke-linecap="round">
    <line x1="240" y1="66" x2="232" y2="84"/><line x1="300" y1="60" x2="292" y2="78"/>
    <line x1="360" y1="68" x2="352" y2="86"/><line x1="430" y1="58" x2="422" y2="76"/>
    <line x1="490" y1="66" x2="482" y2="84"/><line x1="550" y1="62" x2="542" y2="80"/>
  </g>
  <!-- ground -->
  <rect x="0" y="330" width="760" height="90" fill="#eef1ec"/>
  <line x1="0" y1="330" x2="760" y2="330" stroke="#d8ddd4" stroke-width="2"/>
  <!-- street ponding left -->
  <path d="M30 330 h150 v-6 q-40 -10 -75 -6 t-75 6 Z" fill="#bfe6ec"/>
  <!-- house -->
  <g>
    <rect x="250" y="210" width="300" height="120" fill="#f7fafb" stroke="#0e2433" stroke-width="2.5"/>
    <polygon points="235,210 400,110 565,210" fill="#ffffff" stroke="#0e2433" stroke-width="2.5"/>
    <rect x="285" y="250" width="55" height="80" fill="#e6f4f6" stroke="#0e2433" stroke-width="2"/>
    <rect x="420" y="245" width="60" height="45" fill="#e6f4f6" stroke="#0e2433" stroke-width="2"/>
    <!-- chimney/flashing -->
    <rect x="480" y="132" width="30" height="55" fill="#f7fafb" stroke="#0e2433" stroke-width="2.5"/>
    <!-- gutter + downspout -->
    <line x1="235" y1="210" x2="250" y2="210" stroke="#0d94a8" stroke-width="5"/>
    <line x1="565" y1="210" x2="550" y2="210" stroke="#0d94a8" stroke-width="5"/>
    <path d="M565 210 v112" stroke="#0d94a8" stroke-width="5" fill="none"/>
    <!-- water pooling at downspout -->
    <ellipse cx="572" cy="330" rx="34" ry="6" fill="#bfe6ec"/>
    <!-- crawl vents -->
    <rect x="262" y="318" width="26" height="9" fill="#0e2433"/>
    <rect x="512" y="318" width="26" height="9" fill="#0e2433"/>
    <!-- crawl space water -->
    <path d="M252 328 q30 -6 60 0 t60 0 t60 0 t60 0 t56 0" stroke="#31aebf" stroke-width="3" fill="none" opacity="0.7"/>
  </g>
  <!-- grading arrow toward house -->
  <path d="M660 322 l-70 6" stroke="#8c4437" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8c4437"/>
    </marker>
  </defs>
  <!-- callouts -->
  <g font-size="13" font-weight="700">
    <circle cx="497" cy="118" r="13" fill="#0d94a8"/><text x="497" y="123" text-anchor="middle" fill="#fff">1</text>
    <circle cx="588" cy="196" r="13" fill="#0d94a8"/><text x="588" y="201" text-anchor="middle" fill="#fff">2</text>
    <circle cx="648" cy="300" r="13" fill="#0d94a8"/><text x="648" y="305" text-anchor="middle" fill="#fff">3</text>
    <circle cx="240" cy="300" r="13" fill="#0d94a8"/><text x="240" y="305" text-anchor="middle" fill="#fff">4</text>
    <circle cx="105" cy="300" r="13" fill="#0d94a8"/><text x="105" y="305" text-anchor="middle" fill="#fff">5</text>
  </g>
  <g font-size="12.5" fill="#33454f">
    <text x="36" y="382">1&#160;&#160;Roof + flashing failures</text>
    <text x="240" y="382">2&#160;&#160;Clogged gutters, short downspouts</text>
    <text x="520" y="382">3&#160;&#160;Grading toward the house</text>
    <text x="36" y="404">4&#160;&#160;Crawl space vents near grade</text>
    <text x="240" y="404">5&#160;&#160;Street ponding at the driveway</text>
  </g>
</svg>
