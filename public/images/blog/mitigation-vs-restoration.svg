<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="mvrT mvrD" font-family="Inter, -apple-system, Segoe UI, sans-serif">
  <title id="mvrT">Water mitigation versus water damage restoration</title>
  <desc id="mvrD">Two phases side by side. Phase one, water mitigation, happens in hours to days and stops the damage: water extraction, removing wet materials that cannot be saved, drying with air movers and dehumidifiers, and moisture readings until dry. Phase two, restoration, takes one to six weeks and puts the house back: new drywall and insulation, texture and paint, flooring, and cabinets and trim. Mitigation must finish before restoration starts.</desc>
  <rect width="760" height="360" rx="16" fill="#ffffff"/><rect width="760" height="360" rx="16" fill="none" stroke="#e4ebee"/>
  <text x="30" y="42" font-size="15" font-weight="700" fill="#0e2433">Two jobs, in a fixed order</text>
  <text x="30" y="63" font-size="12" fill="#54707c">Mitigation stops the damage. Restoration puts the house back. You cannot start the second on a wet house.</text>

  <rect x="30" y="86" width="320" height="244" rx="12" fill="#f2fafb" stroke="#cdeef2"/>
  <rect x="30" y="86" width="320" height="46" rx="12" fill="#0a7486"/>
  <rect x="30" y="118" width="320" height="14" fill="#0a7486"/>
  <text x="50" y="114" font-size="14" font-weight="700" fill="#ffffff">1 · Water mitigation</text>
  <text x="330" y="114" font-size="11" fill="#cdeef2" text-anchor="end">hours to days</text>
  <g font-size="12.5" fill="#0e2433">
    <circle cx="56" cy="162" r="4" fill="#0a7486"/><text x="70" y="166">Extract standing water</text>
    <circle cx="56" cy="196" r="4" fill="#0a7486"/><text x="70" y="200">Remove what cannot be dried</text>
    <circle cx="56" cy="230" r="4" fill="#0a7486"/><text x="70" y="234">Air movers + dehumidifiers</text>
    <circle cx="56" cy="264" r="4" fill="#0a7486"/><text x="70" y="268">Daily moisture readings</text>
  </g>
  <text x="50" y="312" font-size="11" fill="#54707c">Goal: dry standard, documented</text>

  <g transform="translate(380 208)">
    <circle r="18" fill="#ffffff" stroke="#cfdbe0" stroke-width="2"/>
    <path d="M-7 0 h12 M1 -6 l6 6 l-6 6" stroke="#0a7486" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="410" y="86" width="320" height="244" rx="12" fill="#f7fafb" stroke="#e4ebee"/>
  <rect x="410" y="86" width="320" height="46" rx="12" fill="#0e2433"/>
  <rect x="410" y="118" width="320" height="14" fill="#0e2433"/>
  <text x="430" y="114" font-size="14" font-weight="700" fill="#ffffff">2 · Restoration</text>
  <text x="710" y="114" font-size="11" fill="#9fd8e0" text-anchor="end">1 to 6 weeks</text>
  <g font-size="12.5" fill="#0e2433">
    <circle cx="436" cy="162" r="4" fill="#54707c"/><text x="450" y="166">New drywall + insulation</text>
    <circle cx="436" cy="196" r="4" fill="#54707c"/><text x="450" y="200">Texture + paint</text>
    <circle cx="436" cy="230" r="4" fill="#54707c"/><text x="450" y="234">Flooring</text>
    <circle cx="436" cy="264" r="4" fill="#54707c"/><text x="450" y="268">Cabinets, baseboard, trim</text>
  </g>
  <text x="430" y="312" font-size="11" fill="#54707c">Goal: pre-loss condition</text>
</svg>
