<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="wsT wsD" font-family="Inter, -apple-system, Segoe UI, sans-serif">
  <title id="wsT">Where the water shutoffs are in a Central Valley home</title>
  <desc id="wsD">Four shutoff locations: the fixture angle stop under a sink or behind a toilet, the cold inlet valve on top of the water heater, the whole-house valve near the front hose bib or in the garage, and the curb meter box valve by the sidewalk which may need a meter key.</desc>
  <rect width="760" height="350" rx="16" fill="#ffffff"/><rect width="760" height="350" rx="16" fill="none" stroke="#e4ebee"/>
  <text x="30" y="42" font-size="15" font-weight="700" fill="#0e2433">Find these before you need them</text>
  <text x="30" y="63" font-size="12" fill="#54707c">Work outward: closest valve to the leak first, the street last.</text>

  <g stroke="#cfdbe0" stroke-width="2" fill="none">
    <path d="M60 300 h420"/>
    <path d="M96 300 v-118 l124 -66 l124 66 v118"/>
  </g>
  <rect x="140" y="212" width="60" height="52" fill="#eef3f5" stroke="#cfdbe0" stroke-width="2"/>
  <rect x="252" y="196" width="52" height="68" fill="#eef3f5" stroke="#cfdbe0" stroke-width="2"/>
  <rect x="332" y="248" width="44" height="52" fill="#eef3f5" stroke="#cfdbe0" stroke-width="2"/>
  <rect x="500" y="278" width="56" height="24" rx="3" fill="#eef3f5" stroke="#cfdbe0" stroke-width="2"/>
  <text x="146" y="284" font-size="10" fill="#93a3ab">sink</text>
  <text x="256" y="284" font-size="10" fill="#93a3ab">heater</text>
  <text x="332" y="316" font-size="10" fill="#93a3ab">garage</text>
  <text x="500" y="318" font-size="10" fill="#93a3ab">meter box</text>

  <g font-size="11" font-weight="700" fill="#ffffff">
    <circle cx="170" cy="238" r="13" fill="#0a7486"/><text x="170" y="242" text-anchor="middle">1</text>
    <circle cx="278" cy="188" r="13" fill="#0a7486"/><text x="278" y="192" text-anchor="middle">2</text>
    <circle cx="354" cy="240" r="13" fill="#0a7486"/><text x="354" y="244" text-anchor="middle">3</text>
    <circle cx="528" cy="266" r="13" fill="#0a7486"/><text x="528" y="270" text-anchor="middle">4</text>
  </g>

  <g>
    <rect x="596" y="84" width="134" height="228" rx="12" fill="#f7fafb" stroke="#e4ebee"/>
    <g font-weight="700" fill="#0e2433" font-size="12">
      <text x="614" y="118">Angle stop</text><text x="614" y="172">Water heater</text>
      <text x="614" y="226">Whole house</text><text x="614" y="280">Curb meter</text>
    </g>
    <g fill="#54707c" font-size="10.5">
      <text x="614" y="134">Under sink,</text><text x="614" y="148">behind toilet</text>
      <text x="614" y="188">Cold inlet,</text><text x="614" y="202">valve on top</text>
      <text x="614" y="242">Hose bib or</text><text x="614" y="256">garage wall</text>
      <text x="614" y="296">Sidewalk box,</text><text x="614" y="310">may need a key</text>
    </g>
  </g>
  <g font-size="10" font-weight="700" fill="#0a7486">
    <text x="600" y="118">1</text><text x="600" y="172">2</text><text x="600" y="226">3</text><text x="600" y="280">4</text>
  </g>
</svg>
