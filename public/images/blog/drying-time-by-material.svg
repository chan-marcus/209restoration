<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="dtmTitle dtmDesc" font-family="Inter, -apple-system, Segoe UI, sans-serif">
  <title id="dtmTitle">Typical structural drying time by material</title>
  <desc id="dtmDesc">Bar chart of drying duration. Carpet and pad two to three days. Drywall and framing three to four days. Laminate or engineered flooring five to seven days. Crawl space seven to ten days. Plaster and lath seven to ten days. Solid hardwood seven to fourteen days.</desc>
  <rect width="760" height="350" rx="16" fill="#ffffff"/>
  <rect width="760" height="350" rx="16" fill="none" stroke="#e4ebee"/>

  <text x="30" y="42" font-size="15" font-weight="700" fill="#0e2433">What actually sets the drying clock</text>
  <text x="30" y="64" font-size="12" fill="#54707c">Same amount of water, very different timelines, depending on what it soaked into.</text>

  <!-- gridlines: 0, 3, 7, 14 days over 510px from x=210 -->
  <g stroke="#eef3f5" stroke-width="1">
    <line x1="210" y1="86" x2="210" y2="292"/>
    <line x1="319" y1="86" x2="319" y2="292"/>
    <line x1="465" y1="86" x2="465" y2="292"/>
    <line x1="720" y1="86" x2="720" y2="292"/>
  </g>
  <g font-size="10.5" fill="#8b9aa2" text-anchor="middle">
    <text x="210" y="308">0</text>
    <text x="319" y="308">3 days</text>
    <text x="465" y="308">7 days</text>
    <text x="720" y="308">14 days</text>
  </g>

  <!-- rows -->
  <g font-size="12">
    <!-- carpet + pad 2-3 -->
    <text x="196" y="104" text-anchor="end" fill="#0e2433" font-weight="600">Carpet + pad</text>
    <rect x="210" y="92" width="73" height="18" rx="4" fill="#0a7486"/>
    <rect x="283" y="92" width="36" height="18" rx="4" fill="#9fd8e0"/>
    <text x="331" y="106" font-size="11.5" fill="#54707c">2&#8211;3 days</text>

    <!-- drywall 3-4 -->
    <text x="196" y="140" text-anchor="end" fill="#0e2433" font-weight="600">Drywall + framing</text>
    <rect x="210" y="128" width="109" height="18" rx="4" fill="#0a7486"/>
    <rect x="319" y="128" width="37" height="18" rx="4" fill="#9fd8e0"/>
    <text x="368" y="142" font-size="11.5" fill="#54707c">3&#8211;4 days</text>

    <!-- laminate 5-7 -->
    <text x="196" y="176" text-anchor="end" fill="#0e2433" font-weight="600">Laminate / engineered</text>
    <rect x="210" y="164" width="182" height="18" rx="4" fill="#0a7486"/>
    <rect x="392" y="164" width="73" height="18" rx="4" fill="#9fd8e0"/>
    <text x="477" y="178" font-size="11.5" fill="#54707c">5&#8211;7 days</text>

    <!-- crawl space 7-10 -->
    <text x="196" y="212" text-anchor="end" fill="#0e2433" font-weight="600">Crawl space</text>
    <rect x="210" y="200" width="255" height="18" rx="4" fill="#0a7486"/>
    <rect x="465" y="200" width="109" height="18" rx="4" fill="#9fd8e0"/>
    <text x="586" y="214" font-size="11.5" fill="#54707c">7&#8211;10 days</text>

    <!-- plaster 7-10 -->
    <text x="196" y="248" text-anchor="end" fill="#0e2433" font-weight="600">Plaster + lath</text>
    <rect x="210" y="236" width="255" height="18" rx="4" fill="#0a7486"/>
    <rect x="465" y="236" width="109" height="18" rx="4" fill="#9fd8e0"/>
    <text x="586" y="250" font-size="11.5" fill="#54707c">7&#8211;10 days</text>

    <!-- hardwood 7-14 -->
    <text x="196" y="284" text-anchor="end" fill="#0e2433" font-weight="600">Solid hardwood</text>
    <rect x="210" y="272" width="255" height="18" rx="4" fill="#0a7486"/>
    <rect x="465" y="272" width="255" height="18" rx="4" fill="#9fd8e0"/>
    <text x="710" y="285" text-anchor="end" font-size="11.5" font-weight="600" fill="#0e2433">7&#8211;14 days</text>
  </g>

  <g font-size="11" fill="#8b9aa2">
    <rect x="30" y="322" width="12" height="10" rx="3" fill="#0a7486"/>
    <text x="50" y="331">fastest case</text>
    <rect x="140" y="322" width="12" height="10" rx="3" fill="#9fd8e0"/>
    <text x="160" y="331">common range</text>
    <text x="290" y="331">Older Valley homes with plaster and raised foundations sit at the slow end.</text>
  </g>
</svg>
