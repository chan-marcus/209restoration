<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="ffhT ffhD" font-family="Inter, -apple-system, Segoe UI, sans-serif">
  <title id="ffhT">The first 48 hours after a house fire</title>
  <desc id="ffhD">Four stages. Hour zero, the fire department releases the property and the building is open and wet. Hours one to six, emergency board up and roof tarp, plus power and gas checks. Hours 6 to 24, soot assessment, water extraction from firefighting, and contents inventory. Day two onward, cleaning soot, treating odor, and starting the insurance scope.</desc>
  <rect width="760" height="340" rx="16" fill="#ffffff"/><rect width="760" height="340" rx="16" fill="none" stroke="#e4ebee"/>
  <text x="30" y="42" font-size="15" font-weight="700" fill="#0e2433">Soot keeps working after the fire is out</text>
  <text x="30" y="64" font-size="12" fill="#54707c">Acidic residue etches metal, glass and finishes within days, so the clock does not stop at the last flame.</text>

  <path d="M118 148 H642" stroke="#cfdbe0" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>

  <g text-anchor="middle">
    <g transform="translate(118 148)">
      <circle r="30" fill="#8c4437"/>
      <path d="M0 -13 c6 7 2 10 0 13 c-5 -4 -9 1 -5 7 a10 10 0 0 0 11 -2 c4 -5 4 -12 -6 -18z" fill="#fff"/>
      <text y="56" font-size="12.5" font-weight="700" fill="#0e2433">Hour 0</text>
      <text y="76" font-size="11" fill="#54707c">fire crew releases</text>
      <text y="92" font-size="11" fill="#54707c">the property</text>
    </g>
    <g transform="translate(293 148)">
      <circle r="30" fill="#0a7486"/>
      <path d="M-12 -10 h24 v20 h-24z M-12 -2 h24 M-4 -10 v20" stroke="#fff" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
      <text y="56" font-size="12.5" font-weight="700" fill="#0e2433">Hours 1 to 6</text>
      <text y="76" font-size="11" fill="#54707c">board up, tarp,</text>
      <text y="92" font-size="11" fill="#54707c">power and gas checks</text>
    </g>
    <g transform="translate(468 148)">
      <circle r="30" fill="#0a7486"/>
      <rect x="-10" y="-13" width="20" height="26" rx="3" stroke="#fff" stroke-width="2.2" fill="none"/>
      <path d="M-5 -5 h10 M-5 2 h10" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      <text y="56" font-size="12.5" font-weight="700" fill="#0e2433">Hours 6 to 24</text>
      <text y="76" font-size="11" fill="#54707c">soot survey, water</text>
      <text y="92" font-size="11" fill="#54707c">out, contents listed</text>
    </g>
    <g transform="translate(642 148)">
      <circle r="30" fill="#0d94a8"/>
      <path d="M-11 6 l7 -7 l5 5 l10 -12" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-11" cy="6" r="2.4" fill="#fff"/>
      <text y="56" font-size="12.5" font-weight="700" fill="#0e2433">Day 2 onward</text>
      <text y="76" font-size="11" fill="#54707c">soot cleaning, odor,</text>
      <text y="92" font-size="11" fill="#54707c">insurance scope</text>
    </g>
  </g>

  <rect x="30" y="274" width="700" height="42" rx="10" fill="#f2fafb" stroke="#cdeef2"/>
  <text x="48" y="300" font-size="12" fill="#0e2433"><tspan font-weight="700">Do not start wiping.</tspan> Dry soot smears into porous surfaces and turns a cleanable wall into a repaint.</text>
</svg>
