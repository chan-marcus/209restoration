<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="mhpTitle mhpDesc" font-family="Inter, -apple-system, Segoe UI, sans-serif">
  <title id="mhpTitle">Where mold hides after water damage</title>
  <desc id="mhpDesc">Cutaway of a wall and floor showing five places mold grows out of sight: inside the wall cavity behind drywall, behind the baseboard, in the carpet pad, under the cabinet toe kick, and on crawl space joists and subfloor below.</desc>
  <rect width="760" height="350" rx="16" fill="#ffffff"/>
  <rect width="760" height="350" rx="16" fill="none" stroke="#e4ebee"/>

  <text x="30" y="42" font-size="15" font-weight="700" fill="#0e2433">The five places it grows out of sight</text>
  <text x="30" y="62" font-size="12" fill="#54707c">Cutaway of a wall meeting the floor. Green shows typical growth.</text>

  <!-- ===================== cutaway ===================== -->
  <g>
    <!-- wall assembly -->
    <rect x="64" y="86" width="10" height="136" fill="#eef3f5" stroke="#cfdbe0"/>
    <rect x="74" y="86" width="32" height="136" fill="#fbfcfd" stroke="#e4ebee"/>
    <rect x="84" y="86" width="12" height="136" fill="#e6ddcd" stroke="#d5c8b2"/>
    <rect x="106" y="86" width="10" height="136" fill="#eef3f5" stroke="#cfdbe0"/>
    <!-- mold climbing the cavity -->
    <ellipse cx="100" cy="200" rx="5" ry="20" fill="#7f8f4e" opacity="0.85"/>
    <ellipse cx="79" cy="206" rx="4" ry="13" fill="#4a5f3a" opacity="0.8"/>

    <!-- baseboard -->
    <rect x="116" y="198" width="13" height="24" fill="#e6ddcd" stroke="#d5c8b2"/>
    <ellipse cx="122" cy="216" rx="5" ry="6" fill="#4a5f3a" opacity="0.85"/>

    <!-- floor build-up -->
    <rect x="129" y="206" width="329" height="8" fill="#f0ece3" stroke="#ddd3c2"/>
    <rect x="129" y="214" width="329" height="8" fill="#e6ddcd" stroke="#d5c8b2"/>
    <rect x="129" y="222" width="329" height="12" fill="#d9cdb8" stroke="#c9bba2"/>
    <ellipse cx="205" cy="218" rx="30" ry="4" fill="#7f8f4e" opacity="0.9"/>

    <!-- cabinet -->
    <rect x="296" y="128" width="108" height="70" fill="#f4f0e8" stroke="#ddd3c2"/>
    <line x1="350" y1="128" x2="350" y2="198" stroke="#ddd3c2"/>
    <rect x="296" y="198" width="108" height="8" fill="#e6ddcd" stroke="#d5c8b2"/>
    <rect x="304" y="198" width="92" height="8" fill="#efe8db"/>
    <ellipse cx="350" cy="203" rx="24" ry="4" fill="#4a5f3a" opacity="0.85"/>

    <!-- crawl space -->
    <rect x="129" y="234" width="329" height="58" fill="#f7f9fa" stroke="#e4ebee"/>
    <g fill="#e6ddcd" stroke="#d5c8b2">
      <rect x="168" y="238" width="11" height="50"/>
      <rect x="248" y="238" width="11" height="50"/>
      <rect x="328" y="238" width="11" height="50"/>
      <rect x="408" y="238" width="11" height="50"/>
    </g>
    <ellipse cx="253" cy="258" rx="15" ry="8" fill="#7f8f4e" opacity="0.8"/>
    <ellipse cx="333" cy="272" rx="13" ry="7" fill="#4a5f3a" opacity="0.8"/>
    <text x="137" y="286" font-size="10.5" fill="#93a3ab">crawl space</text>
    <line x1="129" y1="292" x2="458" y2="292" stroke="#cfdbe0" stroke-width="2"/>
  </g>

  <!-- leader lines -->
  <g stroke="#a9bcc4" stroke-width="1.2" fill="none">
    <path d="M150 176 L127 200"/>
    <path d="M228 176 L208 212"/>
    <path d="M424 176 L370 200"/>
  </g>

  <!-- numbered markers -->
  <g font-size="11" font-weight="700" fill="#ffffff">
    <circle cx="90" cy="150" r="11" fill="#0a7486"/><text x="90" y="154" text-anchor="middle">1</text>
    <circle cx="150" cy="166" r="11" fill="#0a7486"/><text x="150" y="170" text-anchor="middle">2</text>
    <circle cx="228" cy="166" r="11" fill="#0a7486"/><text x="228" y="170" text-anchor="middle">3</text>
    <circle cx="424" cy="166" r="11" fill="#0a7486"/><text x="424" y="170" text-anchor="middle">4</text>
    <circle cx="290" cy="262" r="11" fill="#0a7486"/><text x="290" y="266" text-anchor="middle">5</text>
  </g>

  <!-- ===================== legend ===================== -->
  <g>
    <rect x="500" y="86" width="230" height="206" rx="12" fill="#f7fafb" stroke="#e4ebee"/>
    <g font-weight="700" fill="#0e2433" font-size="12.5">
      <text x="546" y="118">Wall cavity</text>
      <text x="546" y="156">Behind baseboard</text>
      <text x="546" y="194">Carpet pad</text>
      <text x="546" y="232">Cabinet toe kick</text>
      <text x="546" y="270">Crawl space joists</text>
    </g>
    <g fill="#54707c" font-size="11">
      <text x="546" y="134">Drywall wicks upward</text>
      <text x="546" y="172">Trim traps moisture</text>
      <text x="546" y="210">Holds water for weeks</text>
      <text x="546" y="248">Slow leaks under sinks</text>
      <text x="546" y="286">Valley high water tables</text>
    </g>
    <g font-size="11" font-weight="700" fill="#ffffff">
      <circle cx="524" cy="114" r="11" fill="#0a7486"/><text x="524" y="118" text-anchor="middle">1</text>
      <circle cx="524" cy="152" r="11" fill="#0a7486"/><text x="524" y="156" text-anchor="middle">2</text>
      <circle cx="524" cy="190" r="11" fill="#0a7486"/><text x="524" y="194" text-anchor="middle">3</text>
      <circle cx="524" cy="228" r="11" fill="#0a7486"/><text x="524" y="232" text-anchor="middle">4</text>
      <circle cx="524" cy="266" r="11" fill="#0a7486"/><text x="524" y="270" text-anchor="middle">5</text>
    </g>
  </g>
</svg>
