<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" role="img" aria-labelledby="sstT sstD" font-family="Inter, -apple-system, Segoe UI, sans-serif">
  <title id="sstT">Four kinds of smoke residue and how each is cleaned</title>
  <desc id="sstD">Dry smoke comes from fast, hot fires and leaves a powdery residue that vacuums off fairly easily. Wet smoke comes from slow, smouldering fires and leaves a sticky, smeary residue with a strong lingering odor. Protein residue from a kitchen fire is nearly invisible but carries an intense smell and coats every surface. Fuel oil soot from a furnace puff back is thick and greasy and spreads through ductwork.</desc>
  <rect width="760" height="392" rx="16" fill="#ffffff"/><rect width="760" height="392" rx="16" fill="none" stroke="#e4ebee"/>
  <text x="30" y="42" font-size="15" font-weight="700" fill="#0e2433">Four kinds of smoke, four different cleanups</text>
  <text x="30" y="64" font-size="12" fill="#54707c">The residue type decides the method. Using the wrong one sets the stain permanently.</text>

  <g font-size="12" font-weight="700" fill="#54707c">
    <text x="276" y="100">Looks like</text><text x="470" y="100">Cleanup</text>
  </g>
  <line x1="30" y1="112" x2="730" y2="112" stroke="#e4ebee"/>

  <g>
    <text x="30" y="142" font-size="12.5" font-weight="700" fill="#0e2433">Dry smoke</text>
    <text x="30" y="160" font-size="11" fill="#54707c">fast, hot fire</text>
    <text x="276" y="150" font-size="12" fill="#54707c">Powdery, dusty</text>
    <rect x="470" y="136" width="240" height="26" rx="13" fill="#0a7486"/>
    <text x="590" y="153" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">vacuum and dry sponge</text>
    <line x1="30" y1="180" x2="730" y2="180" stroke="#eef3f5"/>

    <text x="30" y="210" font-size="12.5" font-weight="700" fill="#0e2433">Wet smoke</text>
    <text x="30" y="228" font-size="11" fill="#54707c">slow, smouldering</text>
    <text x="276" y="218" font-size="12" fill="#54707c">Sticky, smears</text>
    <rect x="470" y="204" width="240" height="26" rx="13" fill="#9fd8e0"/>
    <text x="590" y="221" font-size="11.5" font-weight="600" fill="#0e2433" text-anchor="middle">solvents, odor work after</text>
    <line x1="30" y1="248" x2="730" y2="248" stroke="#eef3f5"/>

    <text x="30" y="278" font-size="12.5" font-weight="700" fill="#0e2433">Protein</text>
    <text x="30" y="296" font-size="11" fill="#54707c">kitchen fire</text>
    <text x="276" y="286" font-size="12" fill="#54707c">Nearly invisible film</text>
    <rect x="470" y="272" width="240" height="26" rx="13" fill="#8c4437"/>
    <text x="590" y="289" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">degrease everything, then seal</text>
    <line x1="30" y1="316" x2="730" y2="316" stroke="#eef3f5"/>

    <text x="30" y="346" font-size="12.5" font-weight="700" fill="#0e2433">Fuel oil</text>
    <text x="30" y="364" font-size="11" fill="#54707c">furnace puff back</text>
    <text x="276" y="354" font-size="12" fill="#54707c">Thick and greasy</text>
    <rect x="470" y="340" width="240" height="26" rx="13" fill="#8c4437"/>
    <text x="590" y="357" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">ducts cleaned, specialist job</text>
  </g>
</svg>
