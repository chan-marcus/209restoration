<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 358" role="img" aria-labelledby="fchT fchD" font-family="Inter, -apple-system, Segoe UI, sans-serif">
  <title id="fchT">How deep the water was decides how high the drywall cut goes</title>
  <desc id="fchD">Three wall cross sections. Two inches of floodwater gets a cut about two feet up. One foot of water gets a cut about three feet up. Three feet or more of water usually means the drywall comes off to four feet or to the ceiling. In every case the cut sits well above the visible waterline because water wicks upward through the paper facing.</desc>
  <rect width="760" height="358" rx="16" fill="#ffffff"/><rect width="760" height="358" rx="16" fill="none" stroke="#e4ebee"/>
  <text x="30" y="42" font-size="15" font-weight="700" fill="#0e2433">The cut always sits above the waterline</text>
  <text x="30" y="64" font-size="12" fill="#54707c">Drywall wicks water upward through its paper facing, so the visible line is never the wet line.</text>

  <g>
    <rect x="60" y="92" width="170" height="170" fill="#f7fafb" stroke="#cfdbe0" stroke-width="2"/>
    <rect x="60" y="250" width="170" height="12" fill="#9fd8e0" opacity="0.75"/>
    <line x1="60" y1="208" x2="230" y2="208" stroke="#8c4437" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="145" y="284" font-size="12.5" font-weight="700" fill="#0e2433" text-anchor="middle">2 inches of water</text>
    <text x="145" y="302" font-size="11.5" fill="#8c4437" text-anchor="middle">cut about 2 feet up</text>
  </g>
  <g>
    <rect x="295" y="92" width="170" height="170" fill="#f7fafb" stroke="#cfdbe0" stroke-width="2"/>
    <rect x="295" y="226" width="170" height="36" fill="#9fd8e0" opacity="0.75"/>
    <line x1="295" y1="176" x2="465" y2="176" stroke="#8c4437" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="380" y="284" font-size="12.5" font-weight="700" fill="#0e2433" text-anchor="middle">1 foot of water</text>
    <text x="380" y="302" font-size="11.5" fill="#8c4437" text-anchor="middle">cut about 3 feet up</text>
  </g>
  <g>
    <rect x="530" y="92" width="170" height="170" fill="#f7fafb" stroke="#cfdbe0" stroke-width="2"/>
    <rect x="530" y="160" width="170" height="102" fill="#9fd8e0" opacity="0.75"/>
    <line x1="530" y1="100" x2="700" y2="100" stroke="#8c4437" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="615" y="284" font-size="12.5" font-weight="700" fill="#0e2433" text-anchor="middle">3 feet or more</text>
    <text x="615" y="302" font-size="11.5" fill="#8c4437" text-anchor="middle">often to the ceiling</text>
  </g>

  <g font-size="11" fill="#54707c">
    <rect x="258" y="328" width="12" height="12" rx="2" fill="#9fd8e0"/><text x="276" y="338">Floodwater</text>
    <line x1="376" y1="334" x2="400" y2="334" stroke="#8c4437" stroke-width="2.5" stroke-dasharray="7 5"/><text x="408" y="338">Drywall cut line</text>
  </g>
</svg>
