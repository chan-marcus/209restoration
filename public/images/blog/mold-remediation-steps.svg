<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="mrsT mrsD" font-family="Inter, -apple-system, Segoe UI, sans-serif">
  <title id="mrsT">The six steps of professional mold remediation</title>
  <desc id="mrsD">Six steps in order. One, find and stop the moisture source. Two, build plastic containment around the work area. Three, run negative air pressure so spores cannot drift into clean rooms. Four, remove porous material that cannot be cleaned. Five, HEPA vacuum and treat what remains. Six, dry to a documented standard and verify before rebuilding.</desc>
  <rect width="760" height="370" rx="16" fill="#ffffff"/><rect width="760" height="370" rx="16" fill="none" stroke="#e4ebee"/>
  <text x="30" y="42" font-size="15" font-weight="700" fill="#0e2433">What a real remediation looks like</text>
  <text x="30" y="64" font-size="12" fill="#54707c">Spraying and wiping is not on this list. Containment is what separates the two.</text>

  <g font-size="13">
    <g transform="translate(30 86)">
      <rect width="225" height="124" rx="12" fill="#f7fafb" stroke="#e4ebee"/>
      <circle cx="30" cy="34" r="15" fill="#0a7486"/><text x="30" y="39" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
      <text x="56" y="39" font-weight="700" fill="#0e2433">Stop the water</text>
      <text x="22" y="72" font-size="11.5" fill="#54707c">Mold is a moisture problem.</text>
      <text x="22" y="90" font-size="11.5" fill="#54707c">Find the leak first or it</text>
      <text x="22" y="108" font-size="11.5" fill="#54707c">all comes back.</text>
    </g>
    <g transform="translate(267 86)">
      <rect width="225" height="124" rx="12" fill="#f7fafb" stroke="#e4ebee"/>
      <circle cx="30" cy="34" r="15" fill="#0a7486"/><text x="30" y="39" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
      <text x="56" y="39" font-weight="700" fill="#0e2433">Containment</text>
      <text x="22" y="72" font-size="11.5" fill="#54707c">Plastic barriers seal the</text>
      <text x="22" y="90" font-size="11.5" fill="#54707c">work area off from the</text>
      <text x="22" y="108" font-size="11.5" fill="#54707c">rest of the house.</text>
    </g>
    <g transform="translate(504 86)">
      <rect width="226" height="124" rx="12" fill="#f7fafb" stroke="#e4ebee"/>
      <circle cx="30" cy="34" r="15" fill="#0a7486"/><text x="30" y="39" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
      <text x="56" y="39" font-weight="700" fill="#0e2433">Negative air</text>
      <text x="22" y="72" font-size="11.5" fill="#54707c">Air leaves the work zone,</text>
      <text x="22" y="90" font-size="11.5" fill="#54707c">never drifts into clean</text>
      <text x="22" y="108" font-size="11.5" fill="#54707c">rooms carrying spores.</text>
    </g>
    <g transform="translate(30 222)">
      <rect width="225" height="124" rx="12" fill="#f2fafb" stroke="#cdeef2"/>
      <circle cx="30" cy="34" r="15" fill="#0d94a8"/><text x="30" y="39" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
      <text x="56" y="39" font-weight="700" fill="#0e2433">Remove</text>
      <text x="22" y="72" font-size="11.5" fill="#54707c">Drywall, insulation and</text>
      <text x="22" y="90" font-size="11.5" fill="#54707c">pad come out. Porous</text>
      <text x="22" y="108" font-size="11.5" fill="#54707c">material cannot be cleaned.</text>
    </g>
    <g transform="translate(267 222)">
      <rect width="225" height="124" rx="12" fill="#f2fafb" stroke="#cdeef2"/>
      <circle cx="30" cy="34" r="15" fill="#0d94a8"/><text x="30" y="39" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
      <text x="56" y="39" font-weight="700" fill="#0e2433">HEPA and treat</text>
      <text x="22" y="72" font-size="11.5" fill="#54707c">Vacuum, wipe and treat</text>
      <text x="22" y="90" font-size="11.5" fill="#54707c">the framing and surfaces</text>
      <text x="22" y="108" font-size="11.5" fill="#54707c">that stayed.</text>
    </g>
    <g transform="translate(504 222)">
      <rect width="226" height="124" rx="12" fill="#f2fafb" stroke="#cdeef2"/>
      <circle cx="30" cy="34" r="15" fill="#0d94a8"/><text x="30" y="39" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>
      <text x="56" y="39" font-weight="700" fill="#0e2433">Dry and verify</text>
      <text x="22" y="72" font-size="11.5" fill="#54707c">Documented dry standard</text>
      <text x="22" y="90" font-size="11.5" fill="#54707c">before anyone hangs new</text>
      <text x="22" y="108" font-size="11.5" fill="#54707c">drywall.</text>
    </g>
  </g>
</svg>
